name: check permits

on:
  schedule:
    - cron: "*/10 * * * *"   # GitHub may delay or skip runs at busy times
  workflow_dispatch:

concurrency:
  group: check-permits
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      # The state DB is what makes alerts fire once per opening instead of every run.
      - uses: actions/cache/restore@v4
        with:
          path: permit_state.sqlite3
          key: permit-state-${{ github.run_id }}
          restore-keys: permit-state-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check availability
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 -m permit_tracker -c config.json check

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: permit_state.sqlite3
          key: permit-state-${{ github.run_id }}
