name: check permits

on:
  schedule:
    - cron: "*/10 * * * *"   # GitHub may delay or skip runs at busy times
  workflow_dispatch:
  push:                      # re-check right away when the config or code changes
    branches: [main]
    paths:
      - config.json
      - "permit_tracker/**"
      - "web/**"
      - .github/workflows/check-permits.yml

permissions:
  contents: write   # to publish the dashboard to the gh-pages branch

concurrency:
  group: check-permits
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      # The state DB is what makes alerts fire once per opening instead of every run.
      - uses: actions/cache/restore@v4
        with:
          path: permit_state.sqlite3
          key: permit-state-${{ github.run_id }}
          restore-keys: permit-state-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check availability
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 -m permit_tracker -c config.json check --json status.json

      # GitHub Pages serves the gh-pages branch. Force-push a single commit each
      # run so the branch doesn't grow a commit every 10 minutes.
      - name: Publish dashboard
        if: hashFiles('status.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site
          cp web/index.html status.json _site/
          touch _site/.nojekyll
          echo "Generated by the check permits Action; edits here are overwritten." > _site/README.md
          cd _site
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "Dashboard snapshot ${{ github.run_id }}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: permit_state.sqlite3
          key: permit-state-${{ github.run_id }}
